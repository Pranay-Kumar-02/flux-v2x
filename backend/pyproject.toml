[project]
name = "fluxv2x-backend"
version = "0.1.0"
description = "FluxV2X: Adaptive Context-Aware Malicious Flooding Detection and Mitigation (ACAFDM) Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "polars>=1.6.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "duckdb>=1.0.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "email-validator>=2.3.0",
    "pyjwt>=2.15.1",
    "cryptography>=50.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

