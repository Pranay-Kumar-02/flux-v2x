name: Feature Request
description: Propose a new capability, model family, detector, or mitigation policy.
title: "[FEAT]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an enhancement to FluxV2X!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What limitation or research challenge does this feature address?
      placeholder: "As a security engineer evaluating V2X communications, I need to..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution / Technical Design
      description: Describe the proposed architecture, algorithms, API endpoints, or UI changes.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches or existing tools have you considered?
    validations:
      false
  - type: textarea
    id: scientific_relevance
    attributes:
      label: Scientific or Operational Evidence
      description: Cite papers, RFCs, or standards where applicable (e.g., IEEE 1609.2, 3GPP C-V2X).
    validations:
      false
