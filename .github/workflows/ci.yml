name: FluxV2X Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Pytest & Quality Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: ./backend
        run: uv sync --extra dev

      - name: Run test suite with security regressions
        working-directory: ./backend
        run: uv run pytest -v

  frontend-quality:
    name: Frontend TypeScript & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Compile TypeScript and build production bundle
        working-directory: ./frontend
        run: npm run build

  docker-compose-verification:
    name: Docker Compose Syntax & Configuration Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify Docker Compose syntax with mock environment
        env:
          POSTGRES_PASSWORD: test_secure_password_min_32_characters_long_1234
          SECRET_KEY: test_secure_signing_secret_key_min_32_characters_long_5678
        run: docker compose config
