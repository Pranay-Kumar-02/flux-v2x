name: Release Artifacts & Verification

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release-artifacts:
    name: Build & Package Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Run backend tests
        working-directory: ./backend
        run: |
          uv sync --extra dev
          uv run pytest -v

      - name: Build frontend bundle
        working-directory: ./frontend
        run: |
          npm ci || npm install
          npm run build

      - name: Package Frontend Distribution
        run: |
          tar -czf fluxv2x-frontend-dist.tar.gz -C frontend/dist .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fluxv2x-frontend-dist.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
